spring.application.name=empresa-backend

#spring.datasource.url=jdbc:sqlite:./data/empresa.db
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

#spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

#spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

#POOL DE CONEXIONES
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

management.endpoints.web.exposure.include=metrics
# localhost:8085/actuator/metrics -> aqui podemos ver las métricas de la aplicacion

#Esto es para la configuracion de Azure AD, para que la aplicacion pueda validar los tokens de acceso
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

server.port=8085
